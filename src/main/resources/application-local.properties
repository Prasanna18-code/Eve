spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${COLLEGE_EVENT_HUB_DB_URL:jdbc:postgresql://localhost:5432/college_event_hub}
spring.datasource.username=${COLLEGE_EVENT_HUB_DB_USERNAME:postgres}
spring.datasource.password=${COLLEGE_EVENT_HUB_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

student.directory.datasource.url=${COLLEGE_STUDENT_DIRECTORY_DB_URL:jdbc:postgresql://localhost:5432/college_student_directory}
student.directory.datasource.username=${COLLEGE_STUDENT_DIRECTORY_DB_USERNAME:college_student_directory}
student.directory.datasource.password=${COLLEGE_STUDENT_DIRECTORY_DB_PASSWORD}
student.directory.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081
