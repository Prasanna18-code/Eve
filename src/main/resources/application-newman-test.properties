# Load local Newman database credentials from the project-root .env file.
spring.config.import=optional:file:.env[.properties]

# Application test database
spring.datasource.url=jdbc:postgresql://localhost:5432/college_event_hub_newman_test
spring.datasource.username=newman_app_test
spring.datasource.password=${NEWMAN_APP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Student directory test database
student.directory.datasource.url=jdbc:postgresql://localhost:5432/college_student_directory_newman_test
student.directory.datasource.username=newman_directory_test
student.directory.datasource.password=${NEWMAN_DIRECTORY_DB_PASSWORD}
student.directory.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Test server port
server.port=8082
