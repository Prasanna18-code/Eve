spring.config.import=optional:file:.env[.properties]
spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/college_event_hub

# Student Directory Database
student.directory.datasource.url=jdbc:postgresql://localhost:5432/college_student_directory
student.directory.datasource.username=college_student_directory
student.directory.datasource.password=${COLLEGE_STUDENT_DIRECTORY_DB_PASSWORD}
student.directory.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.username=postgres
spring.datasource.password=${COLLEGE_EVENT_HUB_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${COLLEGE_EVENT_HUB_JWT_SECRET}
jwt.expiration=86400000


# Server
server.port=8081
