spring.datasource.url=${COLLEGE_EVENT_HUB_DB_URL}
spring.datasource.username=${COLLEGE_EVENT_HUB_DB_USERNAME}
spring.datasource.password=${COLLEGE_EVENT_HUB_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

student.directory.datasource.url=${COLLEGE_STUDENT_DIRECTORY_DB_URL}
student.directory.datasource.username=${COLLEGE_STUDENT_DIRECTORY_DB_USERNAME}
student.directory.datasource.password=${COLLEGE_STUDENT_DIRECTORY_DB_PASSWORD}
student.directory.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing College Event Hub schema
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
server.port=${PORT:8081}
